<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <title>時計ピッタリ止めゲーム</title>
</head>
<body>
    <h1>時間ぴったりとめようゲーム！！</h1>
    
    <!-- 目標タイムを表示するエリア -->
    <div id="target_disp" style="font-size: 1.5em; font-weight: bold; margin: 10px; color: #333;">「ゲームスタート」を押してお題を出そう！</div>

    #～難易度～
    <div style="margin: 10px;">
        <label for="difficulty" style="font-weight: bold;">難易度：</label>
        <select id="difficulty" style="font-size: 1em; padding: 4px;">
            <option value="easy">かんたん</option>
            <option value="normal" selected>ふつう</option>
            <option value="hard">むずかしい</option>
        </select>
    </div>
    
    <!-- 操作ボタン -->
    <div><button mpy-click="start" id="btn">ゲームスタート</button></div>

    <!-- 文字盤・長針・短針を重ねるエリア -->
    <div id="clock_wrapper">
        <div id="clock_area">
            <img id="face" src="tokei.png" alt="文字盤">
            <img id="minute_hand" src="tyousin2.png" alt="長針">
            <img id="hour_hand" src="tansin2.png" alt="短針">
        </div>
    </div>

    <!-- 結果表示 -->
    <div id="disp" style="font-size: 1.2em; margin-top: 15px; line-height: 1.6;"></div>

    <!-- CSSの定義 -->
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #f9f9f9; 
        }
        
        #clock_wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        #clock_area {
            position: relative;
            width: 350px;
            height: 350px;
            overflow: hidden;
        }
        
        #clock_area img {
            position: absolute;
            top: 0;
            left: 0;
            width: 350px;
            height: 350px;
            object-fit: contain;
        }

        /* 回転アニメーション */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .spinning-fast {
            animation: spin 1.2s linear infinite;
        }

        .spinning-slow {
            animation: spin 3s linear infinite;
        }

        /* かんたん */
        .speed-easy-fast { animation: spin 2.0s linear infinite; }
        .speed-easy-slow { animation: spin 2.0s linear infinite; }

        /* ふつう */
        .speed-normal-fast { animation: spin 1.0s linear infinite; }
        .speed-normal-slow { animation: spin 1.0s linear infinite; }

        /* むずかしい */
        .speed-hard-fast { animation: spin 0.001s linear infinite; }
        .speed-hard-slow { animation: spin 0.001s linear infinite; }
    
    </style>

    <!-- Pythonスクリプトの定義 -->
    <script type="mpy">
        import random
        import math
        from pyscript import document
        from js import window

        # ゲームの状態 (0: スタート前, 1: 長針回転中, 2: 短針回転中)
        game_state = 0
        target_h = 0
        target_m = 0
        minute_angle = 0
        hour_angle = 0

        def start(event):
            global game_state, target_h, target_m, minute_angle, hour_angle

            btn = document.getElementById("btn")
            disp = document.getElementById("disp")
            target_disp = document.getElementById("target_disp")
            min_hand = document.getElementById("minute_hand")
            hour_hand = document.getElementById("hour_hand")

            # 1：ゲームスタート（目標タイムを決定して長針を回す）
            if game_state == 0:
                # 1〜12時、分は 0, 15, 30, 45 からランダムにお題を設定
                target_h = random.randint(1, 12)
                target_m = random.choice([0, 15, 30, 45])
                
                target_disp.innerHTML = f" ここを狙え！！！！： {target_h}時 {target_m}分"
                disp.innerHTML = "まずは<b>長針（分）</b>を狙って止めよう！"

                # 針の位置をリセット
                min_hand.style.transform = "rotate(0deg)"
                hour_hand.style.transform = "rotate(0deg)"

                # 長針を回転スタート
                min_hand.className = "spinning-fast"
                btn.innerHTML = "長針をストップ！"
                game_state = 1

            # 2：長針を止め短針を回す
            elif game_state == 1:
                minute_angle = get_current_angle(min_hand)
                min_hand.className = ""
                min_hand.style.transform = f"rotate({minute_angle}deg)"

                disp.innerHTML = "次は<b>短針（時）</b>を狙って止めよう！"

                # 短針を回転スタート
                hour_hand.className = "spinning-slow"
                btn.innerHTML = "短針をとめる！"
                game_state = 2

            # 3：短針を止め時間（分・時）に変換して判定
            elif game_state == 2:
                hour_angle = get_current_angle(hour_hand)
                hour_hand.className = ""
                hour_hand.style.transform = f"rotate({hour_angle}deg)"

                # 角度（0〜360度）を「分」と「時」に変換
                # 長針: 360度 = 60分 (1分 = 6度)
                stopped_m = round(minute_angle / 6) % 60
                
                # 短針: 360度 = 12時間 (1時間 = 30度)
                stopped_h = int((hour_angle % 360) / 30)
                if stopped_h == 0:
                    stopped_h = 12

                # 誤差の計算
                m_diff = abs(stopped_m - target_m)
                h_diff = abs(stopped_h - target_h)

                score = 100 - (m_diff * 2) - (h_diff * 15)
                if score < 0:
                    score = 0

                # 結果表示
                disp.innerHTML = f"""
                    <b>結果：{stopped_h}時 {stopped_m}分 で止まった！</b><br>
                    目標とのズレ → 時の誤差: {h_diff}時間 / 分の誤差: {m_diff}分
                    <span style="color: #d9534f; font-size: 1.2em;"><b>☆ スコア ☆: {score}点</b></span>
                """
                btn.innerHTML = "もう一度遊ぶ"
                game_state = 0

        def get_current_angle(element):
            """ 針の回転アニメーションの角度を取得して固定する関数 """
            style = window.getComputedStyle(element)
            transform_val = style.getPropertyValue("transform")
            if not transform_val or transform_val == "none":
                return 0
            values = transform_val.replace("matrix(", "").replace(")", "").split(",")
            a = float(values[0])
            b = float(values[1])
            angle = round(math.atan2(b, a) * (180 / math.pi))
            if angle < 0:
                angle += 360
            return angle
    </script>
</body>
</html>
